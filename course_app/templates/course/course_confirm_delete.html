
{% extends 'base.html' %}

{% block title %}حذف دوره | آکادمی{% endblock %}

{% block content %}
<section class="container mx-auto px-4 py-12 max-w-2xl">
    <div class="bg-white rounded-2xl shadow-sm p-8 text-center">

        <h1 class="text-2xl font-bold mb-4">
            حذف دوره
        </h1>

        <p class="text-gray-600 mb-6">
            آیا مطمئن هستید که می‌خواهید دوره
            <strong>{{ course.title }}</strong>
            را حذف کنید؟
        </p>

        <p class="text-red-600 text-sm mb-8">
            این عملیات قابل بازگشت نیست.
        </p>

        <form method="post">
            {% csrf_token %}

<button type="submit"
        style="display: inline-block !important;
               background-color: #dc2626 !important;
               color: #ffffff !important;
               padding: 12px 28px !important;
               border: none !important;
               border-radius: 12px !important;
               font-size: 15px !important;
               font-weight: bold !important;
               cursor: pointer !important;
               visibility: visible !important;
               opacity: 1 !important;">
    بله، حذف شود
</button>
            <a href="{% url 'course_app:course_detail' course.pk %}"
               class="inline-block mr-3 px-6 py-3 rounded-xl border border-gray-300">
                انصراف
            </a>
        </form>

    </div>
</section>
{% endblock %}
